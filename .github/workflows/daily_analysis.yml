name: Daily AI Paper Analysis

on:
  schedule:
    # GitHub Actions cron is UTC. These two entries cover 09:00 America/New_York
    # across daylight-saving and standard time; the gate step below keeps one run.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled runs to 09:00 America/New_York
        id: schedule_gate
        if: github.event_name == 'schedule'
        run: |
          hour="$(TZ=America/New_York date +'%H')"
          minute="$(TZ=America/New_York date +'%M')"
          if [ "$hour:$minute" != "09:00" ]; then
            echo "Not 09:00 America/New_York; skipping analysis."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        run: pytest

      - name: Run AI analysis pipeline
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Commit and push analysis
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/processed_papers.json data/usage_log.json interests reports summaries
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily AI paper analysis"
          git push
