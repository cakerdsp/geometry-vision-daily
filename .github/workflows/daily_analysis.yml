name: Daily AI Paper Analysis

on:
  schedule:
    # GitHub Actions cron is UTC. These two entries cover 09:00 America/New_York
    # across daylight-saving and standard time; the gate step below keeps one run.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Gate scheduled runs to 09:00 America/New_York
        id: schedule_gate
        if: github.event_name == 'schedule'
        run: |
          cron="${{ github.event.schedule }}"
          case "$cron" in
            "0 13 * * *") nominal_utc_time="13:00" ;;
            "0 14 * * *") nominal_utc_time="14:00" ;;
            *)
              echo "Unexpected schedule '$cron'; skipping analysis."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          utc_date="$(date -u +'%Y-%m-%d')"
          ny_time="$(TZ=America/New_York date -d "$utc_date $nominal_utc_time UTC" +'%H:%M')"
          echo "Triggered cron '$cron' maps to $ny_time America/New_York on $utc_date."

          if [ "$ny_time" != "09:00" ]; then
            echo "This is the companion DST/standard-time cron; skipping analysis."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        run: python -m pytest

      - name: Run AI analysis pipeline
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Commit and push analysis
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/processed_papers.json data/usage_log.json interests reports summaries
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily AI paper analysis"
          git push
